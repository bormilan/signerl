on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - "*"
  workflow_dispatch: {}
jobs:
  ci:
    name: OTP ${{matrix.otp_vsn}} on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        otp_vsn: ['26', '27', '28']
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Read development toolchain
        id: toolchain
        shell: bash
        run: |
          awk '$1 == "erlang" {print "otp=" $2} $1 == "rebar" {print "rebar3=" $2}' .tool-versions >> "$GITHUB_OUTPUT"
      - uses: erlef/setup-beam@v1
        id: setup-beam
        with:
          otp-version: ${{matrix.otp_vsn == '28' && steps.toolchain.outputs.otp || matrix.otp_vsn}}
          rebar3-version: ${{steps.toolchain.outputs.rebar3}}
          version-type: ${{matrix.otp_vsn == '28' && 'strict' || 'loose'}}
      - name: Report toolchain versions
        shell: bash
        run: |
          erl -noshell -eval 'Path = filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"]), {ok, Version} = file:read_file(Path), io:format("OTP ~s", [Version]), halt().'
          rebar3 version
      - name: Restore _build
        uses: actions/cache@v4
        with:
          path: _build
          key: "_build-cache-for\
                -os-${{runner.os}}\
                -otp-${{steps.setup-beam.outputs.otp-version}}\
                -rebar3-${{steps.setup-beam.outputs.rebar3-version}}\
                -hash-${{hashFiles('rebar.lock', 'rebar.config', 'elvis.config')}}\
                -src-${{hashFiles('src/**', 'include/**', 'test/**')}}"
      - name: Restore rebar3's cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/rebar3
          key: "rebar3-cache-for\
                -os-${{runner.os}}\
                -otp-${{steps.setup-beam.outputs.otp-version}}\
                -rebar3-${{steps.setup-beam.outputs.rebar3-version}}\
                -hash-${{hashFiles('rebar.lock', 'rebar.config', 'elvis.config')}}"
      - name: Install libxml2-utils (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: Generate test certificates
        shell: bash
        run: scripts/gen_certs.sh
      - name: Run all quality checks
        run: rebar3 tall
